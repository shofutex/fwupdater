[package]
name = "ipcheck-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "ipcheck_mobile"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dependencies]
ipcheck-core = { path = "../ipcheck-core" }
thiserror = "1"

[dependencies.uniffi]
version = "0.29"
